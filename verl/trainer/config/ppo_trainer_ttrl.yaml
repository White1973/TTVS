hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

ttrl:
  # Whether to enable TTRL, refer to (https://arxiv.org/abs/2504.16084)
  enable: true

  # Number of rollouts per prompt, used for actual training
  n_samples_per_prompt: ${actor_rollout_ref.rollout.n}

  # Number of rollouts per prompt, used for label voting
  n_votes_per_prompt: ${actor_rollout_ref.rollout.n}

# Paper-default TTVS configuration (ACL Findings 2026).
data:
  max_prompt_length: 1024
  max_response_length: 3072
  under_performing_acc_lower: 0.125
  under_performing_acc_upper: 0.875
  positive_synthesis_acc_lower: 0.125
  positive_synthesis_acc_upper: 0.875
  mixinput_step: 40
  mixrollout_step: 60

actor_rollout_ref:
  actor:
    optim:
      lr: 5e-7
  rollout:
    n: 32
    temperature: 0.6
    val_kwargs:
      do_sample: true
      n: 16
      temperature: 0.6
      top_p: 0.95
